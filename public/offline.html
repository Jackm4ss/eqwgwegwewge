<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c4a6e">
  <title>Songkran Scanner Offline</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #e0f2fe;
      --panel: rgba(255, 255, 255, 0.92);
      --text: #0f172a;
      --muted: #475569;
      --accent: #0c4a6e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background:
        radial-gradient(circle at top, rgba(14, 165, 233, 0.22), transparent 45%),
        linear-gradient(180deg, #f0f9ff 0%, var(--bg) 100%);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(100%, 28rem);
      border-radius: 1.75rem;
      background: var(--panel);
      border: 1px solid rgba(14, 165, 233, 0.18);
      box-shadow: 0 24px 60px rgba(12, 74, 110, 0.16);
      padding: 1.75rem;
      text-align: center;
    }

    .icon {
      width: 5rem;
      height: 5rem;
      border-radius: 1.25rem;
      display: block;
      margin: 0 auto 1rem;
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      line-height: 1.15;
    }

    p {
      margin: 0.85rem 0 0;
      color: var(--muted);
      line-height: 1.65;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 1.25rem;
      min-height: 3rem;
      padding: 0 1.2rem;
      border-radius: 999px;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="/pwa/icons/icon-192.png" alt="Songkran Scanner app icon">
    <h1>Scanner is offline</h1>
    <p>The Songkran scanner needs a connection before it can refresh session data and send scans. Reconnect, then reopen the gate scanner.</p>
    <a href="/staff">Open scanner again</a>
  </main>
</body>
</html>
